<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google - MotionKit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px;
      background: #fff;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.33;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #5f6368;
      text-align: center;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3c4043;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s ease;
    }
    .btn-submit:hover {
      background: #1557b0;
    }
    .footer-note {
      font-size: 12px;
      color: #5f6368;
      margin-top: 30px;
      line-height: 1.5;
      text-align: center;
    }
    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: #008744;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-container">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
    </div>

    <h1 class="title">Sign in with Google</h1>
    <p class="subtitle">to continue to <strong>MotionKit</strong></p>

    <!-- Clean Google Form: User enters their OWN Gmail -->
    <form id="google-login-form" onsubmit="event.preventDefault(); submitGoogle();">
      <div class="form-group">
        <label class="form-label" for="cust-email">Email or phone</label>
        <input type="email" id="cust-email" class="input-field" placeholder="Enter your Google email (e.g. name@gmail.com)" required autofocus />
      </div>

      <div class="form-group">
        <label class="form-label" for="cust-name">Full Name (optional)</label>
        <input type="text" id="cust-name" class="input-field" placeholder="e.g. Rahul Sharma" />
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Next / Sign In</button>
    </form>

    <div class="secure-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Secure Google Authentication
    </div>

    <div class="footer-note">
      To continue, Google will share your name and email address with MotionKit. See MotionKit's Privacy Policy and Terms of Service.
    </div>
  </div>

  <script>
    function submitGoogle() {
      const emailInput = document.getElementById('cust-email');
      const nameInput = document.getElementById('cust-name');
      const email = emailInput.value.trim();

      if (!email || !email.includes('@')) {
        alert('Please enter a valid Google email address.');
        return;
      }

      let name = nameInput.value.trim();
      if (!name) {
        const localPart = email.split('@')[0];
        name = localPart.charAt(0).toUpperCase() + localPart.slice(1);
      }

      loginWith(name, email);
    }

    function loginWith(name, email) {
      const payload = {
        type: 'OAUTH_AUTH_SUCCESS',
        token: 'google_token_' + Date.now() + '_' + Math.random().toString(36).substring(2),
        user: {
          name: name,
          email: email,
          picture: 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(name)
        }
      };

      localStorage.setItem('user_auth_token', payload.token);
      localStorage.setItem('user_profile', JSON.stringify(payload.user));

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.localStorage.setItem('user_auth_token', payload.token);
          window.opener.localStorage.setItem('user_profile', JSON.stringify(payload.user));
          window.opener.dispatchEvent(new Event('auth-change'));
        } catch (e) {}
        try {
          window.opener.postMessage(payload, '*');
        } catch (e) {}
        setTimeout(() => { window.close(); }, 300);
      } else {
        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect') || '/';
        window.location.href = redirectUrl;
      }
    }
  </script>
</body>
</html>
