      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .tool-btn {
          height: 36px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #ddd;
          border-radius: 6px;

          justify-content: center;
          cursor: pointer;
          transition: 0.2s;
          text-transform: uppercase;
          text-align: center;
          padding: 0 12px;
      }

      .tool-btn:hover {
          border-color: var(--primary);
          background: var(--primary-dim);
          color: #fff;
          transform: translateY(-2px);
      }

      /* Custom Scrollbar for Dark Mode */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--primary-dim);
      }

      @keyframes outline-glow {
        0% { border-color: var(--primary-dim); }
        50% { border-color: var(--primary); }
        100% { border-color: var(--primary-dim); }
      }

      .animate-glow-pulse {
        animation: outline-glow 2s infinite ease-in-out;
        border: 1px solid var(--primary-dim);
      }

      @keyframes shine-infinite {
        0% { left: -100%; }
        30% { left: 100%; }
        100% { left: 100%; }
      }

      .animate-shine-loop {
        position: relative;
        overflow: hidden;
      }

      .animate-shine-loop::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          var(--primary-dim),
          transparent
        );
        animation: shine-infinite 4s infinite;
      }

    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script>
      // Interactive feedback for the website mockup
      function showMockToast(message) {
          let toast = document.getElementById('flex-mock-toast');
          if (!toast) {
              toast = document.createElement('div');
              toast.id = 'flex-mock-toast';
              toast.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--primary); color:#000; padding:10px 20px; border-radius:8px; font-weight:800; font-size:12px; z-index:99999; opacity:0; transition:0.3s; pointer-events:none; text-transform:uppercase; letter-spacing:1px; box-shadow:0 10px 30px var(--primary-dim);";
              document.body.appendChild(toast);
          }

          toast.innerText = message;
          toast.style.opacity = '1';
          toast.style.bottom = '40px';

          setTimeout(() => {
              toast.style.opacity = '0';
              toast.style.bottom = '20px';
          }, 2000);
      }
    </script>
