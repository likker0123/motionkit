      @keyframes outline-glow {
        0% { border-color: var(--primary-dim); }
        50% { border-color: var(--primary); }
        100% { border-color: var(--primary-dim); }
      }

      .animate-glow-pulse {
        animation: outline-glow 2s infinite ease-in-out;

      @keyframes shine-infinite {
        0% { left: -100%; }
        30% { left: 100%; }
        100% { left: 100%; }
      }

      .animate-shine-loop {
        position: relative;
        overflow: hidden;
      }

      .animate-shine-loop::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          var(--primary-dim),
          transparent
